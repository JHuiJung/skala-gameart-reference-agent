[pytest]
pythonpath = .
testpaths = tests
# integration 테스트는 실제 OpenAI/Chroma 를 호출하므로 기본으로는 건너뛴다. 실행: pytest -m integration
addopts = -m "not integration"
markers =
    integration: 실제 외부 서비스(OpenAI, Chroma)를 호출하는 통합 테스트
filterwarnings =
    ignore:langsmith.wrappers._openai_agents is deprecated:DeprecationWarning
